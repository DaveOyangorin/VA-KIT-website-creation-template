$('#datepicker, #datepicker2, #datepicker3').datepicker({

    },

    }

})



var disabledDays = [0, 6];



$('#datepicker, #datepicker2, #datepicker3').datepicker({

    language: 'en',

    onRenderCell: function (date, cellType) {

        if (cellType == 'day') {

            var day = date.getDay(),

                isDisabled = disabledDays.indexOf(day) != -1;



            return {

                disabled: isDisabled

            }

        }

    }

})
